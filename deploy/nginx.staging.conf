# nginx for LedgerLens staging frontend: serve the SPA and reverse-proxy /api + /healthz
# to the backend container (same origin => the browser needs no separate CORS round-trip).
# Real values never live here. Backend reached on the compose network at backend:8001.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Trust the platform proxy for client IP (backend TRUST_PROXY parses X-Forwarded-For).
    # Gzip static assets.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # SPA: unknown non-file routes fall back to index.html (React client routing).
    location / {
        try_files $uri $uri/ /index.html;
    }
    # Cache immutable hashed build assets aggressively; never cache the HTML shell.
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Defer upstream DNS to request time so nginx boots even if 'backend' is not yet
    # resolvable; 127.0.0.11 is Docker's embedded DNS (use your platform resolver if different).
    resolver 127.0.0.11 ipv6=off valid=10s;
    set $backend_upstream http://backend:8001;

    # Reverse proxy the API to the backend service (full original URI preserved -> /api/...).
    location /api/ {
        proxy_pass $backend_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Edge/liveness health check hits the backend /healthz (so the LB reflects real app health).
    location = /healthz {
        proxy_pass $backend_upstream/healthz;
        proxy_set_header Host $host;
    }

    client_max_body_size 100m;   # matches backend MAX_BATCH_SIZE_BYTES for multi-file upload batches
}
