name: LedgerLens CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  backend-and-verification:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: ledgerlens_test
          POSTGRES_USER: ledgerlens
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Check Git formatting and diffs
        run: git diff --check

      - name: Run backend tests (Hermetic with Postgres Service)
        env:
          DATABASE_URL: postgresql://ledgerlens:test_password@localhost:5432/ledgerlens_test
          DATA_BACKEND: memory
          AUTH_SECRET_KEY: test-secret-key-at-least-32-characters-long
          CORS_ORIGINS: http://localhost:3000
          FAL_KEY: ""
          ANTHROPIC_API_KEY: ""
        run: |
          cd backend
          pytest -q

      - name: Run verification suite
        run: python backend/verify_all.py

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Run frontend unit tests
        run: |
          cd frontend
          npm test -- --watchAll=false

      - name: Build frontend production bundle
        run: |
          cd frontend
          npm run build
